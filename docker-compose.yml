services:
  postgres:
    image: postgres:16
    container_name: colosseum-pg
    environment:
      POSTGRES_USER: colosseum
      POSTGRES_PASSWORD: colosseum
      POSTGRES_DB: colosseum
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U colosseum -d colosseum']
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  pgdata:
