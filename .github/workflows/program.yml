name: program

# The Solana programs: build, the LiteSVM suite, the committed interface files, clippy.
# The tools and why each version is what it is: programs/README.md. A bump there is a bump of `env` here.
on:
  pull_request:
    paths:
      - 'programs/**'
      - 'idl/**'
      - 'Anchor.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/program.yml'
  push:
    paths:
      - 'programs/**'
      - 'idl/**'
      - 'Anchor.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/program.yml'

permissions:
  contents: read

concurrency:
  group: program-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SOLANA_VERSION: 3.0.1
  # sha256 of solana-release-x86_64-unknown-linux-gnu.tar.bz2, from the release page
  SOLANA_SHA256: c5bd5e55d87ce71214e312819e3c6cbb55e3b538b4ac3179ee91aec155a23578
  PLATFORM_TOOLS: v1.54
  ANCHOR_VERSION: 0.31.1
  # Clippy runs on the Rust that platform tools v1.54 build the programs with.
  RUST_CLIPPY: 1.89.0
  # Anchor builds the interface files with a nightly. This is the one the committed files were made with.
  RUST_IDL: nightly-2025-09-09

jobs:
  program:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: programs/tests/pnpm-lock.yaml

      - name: Rust toolchains
        run: |
          rustup toolchain install "$RUST_CLIPPY" --profile minimal --component clippy --no-self-update
          rustup toolchain install "$RUST_IDL" --profile minimal --no-self-update

      - name: Cache the Solana CLI and the platform tools
        id: solana
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.local/share/solana
            ~/.cache/solana
          key: solana-${{ runner.os }}-${{ env.SOLANA_VERSION }}-tools-${{ env.PLATFORM_TOOLS }}

      - name: Solana CLI
        if: steps.solana.outputs.cache-hit != 'true'
        run: |
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/solana.tar.bz2" \
            "https://github.com/anza-xyz/agave/releases/download/v${SOLANA_VERSION}/solana-release-x86_64-unknown-linux-gnu.tar.bz2"
          echo "${SOLANA_SHA256}  $RUNNER_TEMP/solana.tar.bz2" | sha256sum -c -
          mkdir -p "$HOME/.local/share/solana"
          # Only what a build needs: the validator and the rest stay in the archive.
          tar -xjf "$RUNNER_TEMP/solana.tar.bz2" -C "$HOME/.local/share/solana" \
            solana-release/version.yml \
            solana-release/bin/cargo-build-sbf \
            solana-release/bin/solana \
            solana-release/bin/solana-keygen \
            solana-release/bin/platform-tools-sdk

      - name: Anchor CLI
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL --retry 3 -o "$HOME/.local/bin/anchor" \
            "https://github.com/solana-foundation/anchor/releases/download/v${ANCHOR_VERSION}/anchor-${ANCHOR_VERSION}-x86_64-unknown-linux-gnu"
          sha256sum "$HOME/.local/bin/anchor"
          chmod +x "$HOME/.local/bin/anchor"

      - name: Put the tools on the path
        run: |
          echo "$HOME/.local/share/solana/solana-release/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Versions
        run: |
          solana --version
          anchor --version
          cargo-build-sbf --version

      - name: Cache cargo and target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ env.PLATFORM_TOOLS }}-${{ env.RUST_CLIPPY }}-${{ env.RUST_IDL }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ env.PLATFORM_TOOLS }}-${{ env.RUST_CLIPPY }}-${{ env.RUST_IDL }}-

      - name: Build the programs
        run: anchor build --no-idl -- --tools-version "$PLATFORM_TOOLS"

      - name: LiteSVM tests
        run: pnpm test:program

      - name: The committed interface files match the programs
        run: |
          for program in basket mock_router; do
            RUSTUP_TOOLCHAIN="$RUST_IDL" anchor idl build -p "$program" -o "$RUNNER_TEMP/$program.json"
            if ! diff -u "idl/$program.json" "$RUNNER_TEMP/$program.json"; then
              echo "::error file=idl/$program.json::The committed file differs from a fresh build. Run: anchor idl build -p $program -o idl/$program.json"
              exit 1
            fi
          done

      # Warnings are listed, not failed on, until the program settles. A compile error or a lint clippy
      # denies by default still fails the step.
      - name: Clippy
        run: |
          set -o pipefail
          cargo +"$RUST_CLIPPY" clippy --workspace --all-targets --locked 2>&1 | tee "$RUNNER_TEMP/clippy.log"
          grep '^warning' "$RUNNER_TEMP/clippy.log" | grep -v ' generated ' | sort | uniq -c | sort -rn > "$RUNNER_TEMP/clippy.txt" || true
          count=$(awk '{ n += $1 } END { print n + 0 }' "$RUNNER_TEMP/clippy.txt")
          {
            echo "### cargo clippy on Rust $RUST_CLIPPY: $count warnings (listed, not failed on)"
            echo '```'
            cat "$RUNNER_TEMP/clippy.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$count" -gt 0 ]; then echo "::warning title=cargo clippy::$count warnings, see the job summary"; fi
