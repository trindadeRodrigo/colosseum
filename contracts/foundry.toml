# The vault contracts. Run from this folder, or from the root with `pnpm test:contracts`.
# Design pins (DESIGN-VAULT.md 3.8): solc 0.8.37, cancun, via_ir, OpenZeppelin 5.6.1, forge-std 1.17.0.
# Dependencies come from pnpm (package.json here); there are no git submodules.
[profile.default]
src = "src"
test = "test"
out = "out"
cache_path = "cache"
libs = ["node_modules"]
# pnpm links node_modules/* into the workspace store one level up.
allow_paths = ["../node_modules"]
auto_detect_remappings = false
remappings = [
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
  "@openzeppelin/contracts-upgradeable/=node_modules/@openzeppelin/contracts-upgradeable/",
  "forge-std/=node_modules/forge-std/src/",
]
solc = "0.8.37"
# OpenZeppelin 5.6.1 names a function `at`, which 0.8.37 warns will become a keyword. Our own warnings still show.
ignored_warnings_from = ["node_modules"]
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
# No metadata hash at the end of the bytecode. A vault's address is derived from the proxy's creation code,
# which is compiled into the factory; with the hash in it, a comment or a path changed anywhere in the
# proxy's sources would move the address of every vault not yet created. Without it, only a change to what
# the compiler emits for the proxy does. A test pins that code.
bytecode_hash = "none"
cbor_metadata = false
# The entry-point tests read the built ABIs, the registry tests read the shared limit vectors, the deploy
# script reads its per-network config, and one test holds the committed ABIs to the build.
fs_permissions = [
  { access = "read", path = "./out" },
  { access = "read", path = "../fixtures/creator-limits" },
  { access = "read", path = "./script/config" },
  { access = "read", path = "../idl/evm" },
]

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 100
fail_on_revert = false

[fmt]
line_length = 120
